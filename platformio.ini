; =========================================================
; PlatformIO Configuration for GreenSlot IoT System
; =========================================================

; 1. MÔI TRƯỜNG ARDUINO UNO (Đọc cảm biến BH1750, pH, Ẩm đất)
[env:uno_sensors]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
; upload_port = COM8  ; Bỏ comment và đổi số COM nếu cần chỉ định cổng nạp
build_src_filter = +<uno_sensors.cpp>
lib_deps =
    claws/BH1750@^1.3.0

; 2. MÔI TRƯỜNG ESP32 MASTER (WiFi + UDP Radar + Bơm Relay)
[env:esp32_master]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 9600
monitor_echo = yes
monitor_filters = send_on_enter
build_src_filter = +<esp32_master.cpp>

; 3. MÔI TRƯỜNG ESP32-CAM (Camera AI-Thinker Live Stream)
[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 9600
monitor_rts = 0
monitor_dtr = 0
board_build.partitions = huge_app.csv
build_src_filter = +<esp_camera.cpp>
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue