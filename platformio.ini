; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; =========================================================
; 1. MÔI TRƯỜNG ARDUINO UNO (Đọc cảm biến đất & ánh sáng)
; =========================================================
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

; 📍 Lệnh này bảo PIO: Khi chọn Uno thì CHỈ dịch file uno_sensors.cpp
build_src_filter = +<uno_sensors.cpp>

lib_deps =
    claws/BH1750@^1.3.0


; =========================================================
; 2. MÔI TRƯỜNG ESP32-CAM (Live Stream & Gửi Heartbeat IP)
; =========================================================
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

; Tốc độ Monitor (Phải khớp 100% với dòng Serial.begin(...) trong file esp_camera.cpp)
monitor_speed = 9600

; Hai dòng này CỰC KÌ QUAN TRỌNG giúp PIO không làm treo mạch ESP32-CAM khi mở Monitor
monitor_rts = 0
monitor_dtr = 0

board_build.partitions = huge_app.csv

; Lệnh chỉ dịch file esp_camera.cpp
build_src_filter = +<esp_camera.cpp>

; Kích hoạt RAM ngoài (PSRAM) cho Camera
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue